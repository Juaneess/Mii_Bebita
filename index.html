<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cami el amor de mi vida 💙</title>

<style>

html{
scroll-behavior:smooth;
}

body{
margin:0;
padding:0;
font-family:'Times New Roman',serif;
background:linear-gradient(135deg,#0f2f5f,#2563eb,#60a5fa);
color:white;
overflow-x:hidden;
}

/* PANTALLAS */

.screen{
display:none;
min-height:100vh;
justify-content:center;
align-items:center;
flex-direction:column;
text-align:center;
padding:30px 20px;
box-sizing:border-box;
}

.active{
display:flex;
}

/* TEXTOS CLAVE */

.texto{
opacity:0;
transform:translateY(10px);
animation:aparecer 1s forwards;
}

.fade1{animation-delay:0.5s;}
.fade2{animation-delay:1.2s;}
.fade3{animation-delay:1.9s;}

@keyframes aparecer{
to{
opacity:1;
transform:translateY(0);
}
}

.especial{
position:relative;
display:inline-block;
margin:12px 0;
font-size:22px;
}

.corazon{
position:absolute;
top:-8px;
right:-10px;
width:8px;
height:8px;
background:#bfe4ff;
transform:rotate(45deg);
}

.corazon::before,
.corazon::after{
content:"";
position:absolute;
width:8px;
height:8px;
background:#bfe4ff;
border-radius:50%;
}

.corazon::before{
top:-4px;
left:0;
}

.corazon::after{
left:-4px;
top:0;
}

/* DISPLAY */

#display{
margin-top:20px;
font-size:24px;
letter-spacing:8px;
}

/* TECLADO */

.keypad{
display:grid;
grid-template-columns:repeat(3,70px);
gap:12px;
margin-top:25px;
opacity:0;
transition:1s;
}

.mostrar{
opacity:1;
}

.key{
background:rgba(255,255,255,0.12);
border:1px solid rgba(255,255,255,0.2);
border-radius:18px;
padding:15px;
font-size:20px;
color:white;
cursor:pointer;
transition:0.2s;
backdrop-filter:blur(5px);
}

.key:hover{
background:rgba(255,255,255,0.25);
transform:scale(1.08);
}

.cero{
grid-column:2;
}

/* INTRO */

.intro{
font-size:34px;
max-width:700px;
line-height:1.8;
animation:suave 2s infinite alternate;
}

@keyframes suave{
from{opacity:0.7;}
to{opacity:1;}
}

.heart-btn{
margin-top:25px;
font-size:30px;
cursor:pointer;
animation:latido 2s infinite;
}

@keyframes latido{
0%,100%{transform:scale(1);}
50%{transform:scale(1.15);}
}

/* CARTA */

.notepad{
width:100%;
max-width:900px;
margin:auto;
padding:80px 25px;
box-sizing:border-box;
}

.notepad h1{
text-align:center;
font-size:46px;
margin-bottom:80px;
}

/* MENSAJE */

.mensaje{
position:relative;
font-size:22px;
line-height:1.9;
padding-left:120px;
text-align:left;
white-space:normal;
animation:fadeUp 1s ease;
}

/* IMAGENES */

.mensaje img{
position:absolute;
left:0;
top:0;
width:75px;
border-radius:16px;
box-shadow:0 8px 20px rgba(0,0,0,0.30);
opacity:0;
}

/* UNA FOTO A LA VEZ */

.mensaje img:nth-child(1){
animation:fotos 20s infinite;
}

.mensaje img:nth-child(2){
animation:fotos 20s infinite 4s;
}

.mensaje img:nth-child(3){
animation:fotos 20s infinite 8s;
}

.mensaje img:nth-child(4){
animation:fotos 20s infinite 12s;
}

.mensaje img:nth-child(5){
animation:fotos 20s infinite 16s;
}

@keyframes fotos{

0%{
opacity:0;
transform:translateY(15px);
}

10%{
opacity:1;
transform:translateY(0);
}

25%{
opacity:1;
}

35%{
opacity:0;
}

100%{
opacity:0;
}

}

/* TEXTO */

@keyframes fadeUp{
from{
opacity:0;
transform:translateY(30px);
}
to{
opacity:1;
transform:translateY(0);
}
}

/* FINAL */

.final-btn{
display:block;
margin:120px auto 0;
padding:14px 34px;
border:none;
border-radius:30px;
background:rgba(255,255,255,0.15);
color:white;
font-size:18px;
cursor:pointer;
transition:0.3s;
}

.final-btn:hover{
transform:scale(1.05);
background:rgba(255,255,255,0.25);
}

#mensajeFinal{
opacity:0;
margin-top:60px;
font-size:32px;
text-align:center;
transition:2s;
line-height:1.8;
padding-bottom:100px;
}

/* RESPONSIVE */

@media(max-width:900px){

.mensaje{
font-size:20px;
line-height:1.8;
padding-left:95px;
}

.mensaje img{
width:65px;
}

}

</style>
</head>
